name: Chornomorka November budget

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Build November budget
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python automation/build_chornomorka_nov2026_budget.py

      - name: Commit and push
        run: |
          git config user.name "bolt-reports-bot"
          git config user.email "actions@github.com"
          git add chornomorka/chornomorka_nov2026_marketing_budget.html \
                  chornomorka/chornomorka_nov2026_budget_data.json \
                  chornomorka/chornomorka_nov2026_letter_facts.json \
                  chornomorka/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Чорноморка: маркетинговий бюджет на листопад 2026 (3% від ТО жовтня)"
            git push
          fi
